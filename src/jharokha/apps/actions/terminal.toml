# Terminal actions, built in. They work only in a terminal already in front: they never
# switch to one, since a command typed anywhere else goes somewhere else (a browser's
# address bar searches the web for it). A command runs under the default allow: which
# commands only read cannot be told from their text (an allowlist passed none of a live
# day's 93), and a flag every call carries guards nothing. --allow-input is the opt-in.
format = 1

[action.terminal.run]
summary = """Run one command in the shell in front and return what it printed and its exit
code, read up to an end marker the command prints (not the prompt, which OCR misreads)."""
args.command = { type = "text", max_len = 2000, doc = "one line" }
args.shell = { type = "choice", choices = ["powershell", "cmd", "bash"], default = "powershell" }

[[action.terminal.run.step]]
do = "focus"

[[action.terminal.run.step]]
do = "run"
command = "{command}"
shell = "{shell}"
region = "body"
clear = true  # cls on the same line, so the reply starts at the top whatever OCR makes of its echo
timeout_s = 30

# Prints every printable ASCII glyph in a known order and learns what each looks like in
# this terminal's font, so later reads match cells instead of running OCR (core.glyphs).
[action.terminal.glyphs]
summary = """Learn the terminal's font: prints the printable ASCII alphabet (two lines, nothing
else) and remembers each glyph, so terminal reads are exact and fast from then on. Once per
session, before terminal work; again after a zoom or font change."""
args.shell = { type = "choice", choices = ["powershell", "cmd", "bash"], default = "powershell" }

[[action.terminal.glyphs.step]]
do = "focus"

[[action.terminal.glyphs.step]]
do = "run"
learn = "glyphs"
shell = "{shell}"
region = "body"
clear = true
timeout_s = 20

[action.terminal.put_file]
summary = """Write a file in the shell in front: its bytes as base64 typed in short chunks, each
confirmed, then decoded there and its SHA-256 checked against the one sent."""
args.path = { type = "text", max_len = 260 }
args.content_base64 = { type = "base64", max_len = 200000 }
args.shell = { type = "choice", choices = ["powershell", "cmd", "bash"], default = "powershell" }

[[action.terminal.put_file.step]]
do = "focus"

[[action.terminal.put_file.step]]
do = "put_file"
path = "{path}"
content_base64 = "{content_base64}"
shell = "{shell}"
region = "body"
timeout_s = 15
