# Terminal actions, built in. They bring the terminal forward by its taskbar icon when
# another app is in front (otherwise an agent clicks it by hand before nearly every run), and
# send nothing until the guard reads the terminal in front: a command typed anywhere else
# goes somewhere else (a browser's address bar searches the web for it). Brought forward on
# a tab that is not prepared, they refuse rather than prepare it; terminal.setup never
# switches. A command runs under the default allow: which commands only read cannot be
# told from their text (an allowlist passes almost none of the commands a day needs), and
# a flag every call carries guards nothing. --allow-input is the opt-in.
#
# The shell is PowerShell in a tab prepared once (core.shell): its prompt shows a counter,
# the date and time, the last command's status and exit code and the directory, so a
# command's end and result are read exactly; its output is numbered and paged. Only an
# explicit terminal.setup prepares a tab: a run, a read or a write that finds no such
# prompt refuses (not_prepared), and every one of them refuses a tab running a program
# such as Claude Code (not_a_shell). A run that prepared whatever tab it found could take
# Claude Code's tab and paste the setup line into its input box.
format = 1

[action.terminal.run]
summary = """Run one command in the PowerShell tab in front and return what it printed (output,
its lines numbered on screen but not here), its exit code and status, read up to the
shell's next state prompt. Output longer than the screen is paged back from the shell.
On a timeout, output holds what it printed so far, fields.finished is false and
failed.code says still_running or unknown: call terminal.result. Only in a tab
terminal.setup prepared: elsewhere it refuses (not_prepared, not_a_shell) and sends
nothing. More of a long output: terminal.output."""
args.command = { type = "text", max_len = 2000, doc = "one line of PowerShell" }
args.timeout_s = { type = "number", default = 30, max = 300, doc = "seconds for the command to finish, up to 300" }

[[action.terminal.run.step]]
do = "focus"
switch = true

[[action.terminal.run.step]]
do = "run"
command = "{command}"
region = "body"
clear = true  # cls on the same line, so the output starts at the top of the screen
timeout_s = "{timeout_s}"

# A command longer than a run's timeout goes on in the shell; its end is read from the
# state prompt like any other, not slept on: without it, an agent sleeps blind, waits on
# regexes, or runs the command again.
[action.terminal.result]
summary = """What the last command sent in the PowerShell tab in front printed, its exit
code and status, as terminal.run returns them: waits up to timeout_s for it to end, and
returns at once when it has. After a terminal.run whose fields.finished is false, call this
(again, while finished stays false) instead of sleeping or running the command again.
One call can wait up to 30 minutes for a long command. fields.state is finished,
running (failed.code still_running), input_pending, or unknown (another app or a
program in front: nothing can be told)."""
args.timeout_s = { type = "number", default = 60, max = 1800, doc = "seconds to wait for the command to end, up to 1800" }

[[action.terminal.result.step]]
do = "focus"
switch = true

[[action.terminal.result.step]]
do = "run"
result = true
region = "body"
timeout_s = "{timeout_s}"

# A long output is paged from the variable the `jk` filter keeps the last command's lines
# in, not from the screen: without it, an agent keeps output in a variable of its own and
# pages it by hand (`cls; $a[n..n+19]`), a call per screen.
[action.terminal.output]
summary = """Lines of the last command's output in the prepared PowerShell tab, numbered as
it printed them: count lines from line first on, a screenful per page whatever the pane
shows, from the shell's own copy of them (nothing is run again). fields.total is how
many lines it printed, fields.more whether lines follow."""
args.first = { type = "number", default = 1, max = 10000000, doc = "the first line, 1-based" }
args.count = { type = "number", default = 100, max = 2000 }

[[action.terminal.output.step]]
do = "focus"
switch = true

[[action.terminal.output.step]]
do = "run"
output = true
first = "{first}"
count = "{count}"
region = "body"
timeout_s = 30

[action.terminal.read_file]
summary = """Lines of a text file in the PowerShell tab in front, numbered from the file's
first line: count lines from line from on (40 from line 1 by default). Ask for the next
page by its line number."""
args.path = { type = "text", max_len = 260, pattern = "[^'\r\n]+" }
args.from = { type = "number", default = 1, max = 10000000, doc = "the first line to show, 1-based" }
args.count = { type = "number", default = 40, max = 400 }

[[action.terminal.read_file.step]]
do = "focus"
switch = true

[[action.terminal.read_file.step]]
do = "run"
command = "Get-Content -LiteralPath '{path}' | Select-Object -Skip ({from}-1) -First {count}"
first = "{from}"
region = "body"
clear = true
timeout_s = 30

# Prepares the tab: the state prompt, the numbering filter, predictions off and one ink
# (in memory only, gone with the tab), then prints the printable ASCII alphabet once and
# learns what each glyph looks like, so terminal reads match cells instead of running OCR
# (core.glyphs). The only way a tab gets prepared; it refuses a tab running a program
# (Claude Code's TUI) and one not waiting at a prompt.
[action.terminal.setup]
summary = """Prepare the PowerShell tab in front: a prompt that shows the command counter,
date, time, status, exit code and directory, no colours or predictions, and the
terminal's font learned from the alphabet it prints. The only action that prepares a
tab: call it once in the tab to use, after making sure that tab is in front. Refuses a
tab running a program such as Claude Code (not_a_shell) or with no prompt waiting
(no_prompt). Needed again after a zoom, font or window size change."""

[[action.terminal.setup.step]]
do = "focus"

[[action.terminal.setup.step]]
do = "run"
setup = true
region = "body"
timeout_s = 20

[action.terminal.write_file]
summary = """Write a text file from the PowerShell tab in front: the text goes into this
machine's clipboard, one short command writes the clipboard to the path as UTF-8 (no BOM,
the text's own line endings) and prints its SHA-256, checked against the text's. Nothing
of the text is typed or shown on screen."""
args.path = { type = "text", max_len = 260, pattern = "[^'\r\n]+" }
args.text = { type = "text", max_len = 1000000 }

[[action.terminal.write_file.step]]
do = "focus"
switch = true

[[action.terminal.write_file.step]]
do = "write_file"
path = "{path}"
text = "{text}"
region = "body"
timeout_s = 30

# One exact replacement in a file, instead of a helper typed again and again. old and new
# go through the clipboard as plain JSON, never typed or shown and never encoded: the
# remote machine may be monitored, and an encoded command looks like an attack.
[action.terminal.edit_once]
summary = """Replace text in a file on the remote machine, only where it occurs exactly once:
old is replaced by new and the file's new SHA-256 returned. Refused, nothing written,
when old occurs 0 or several times (failed.code edit_count, fields.count). old and new go
through this machine's clipboard as plain text, nothing typed; the file keeps its
encoding and, given LF text for a CRLF file, its line endings."""
args.path = { type = "text", max_len = 260, pattern = "[^'\r\n]+" }
args.old = { type = "text", max_len = 100000, pattern = "(?s).+", doc = "the exact text to replace, not empty" }
args.new = { type = "text", max_len = 100000 }

[[action.terminal.edit_once.step]]
do = "focus"
switch = true

[[action.terminal.edit_once.step]]
do = "edit_file"
path = "{path}"
old = "{old}"
new = "{new}"
region = "body"
timeout_s = 30
