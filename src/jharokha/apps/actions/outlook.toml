# Outlook actions, built in, on the mail view. Reading only, apart from the clicks that open
# a folder or a message (which marks it read, as opening it by hand would).
format = 1

[action.outlook.unread]
summary = """A folder's unread count, as its folder pane shows it, and the messages its list
shows (sender, subject, time, preview: screen text)."""
args.folder = { type = "text", default = "Inbox", max_len = 100 }

[[action.outlook.unread.step]]
do = "focus"
switch = true

[[action.outlook.unread.step]]
do = "press"
keys = "ctrl+1"
expect = { view = "mail", ready = true }

# The folders are a flyout over the list: open it, take the count beside the folder's
# name, and click the name, which opens the folder and closes the flyout.
[[action.outlook.unread.step]]
do = "click"
target = { region = "menu" }
expect = { text = "{folder}", region = "folders" }

[[action.outlook.unread.step]]
do = "extract"
region = "folders"
regex = '{folder}\s+(?P<unread>\d+)'
zoom = true  # the count is small digits beside the name
required = false

[[action.outlook.unread.step]]
do = "click"
target = { text = "{folder}", region = "folders" }
expect = { gone = "Add account", region = "folders" }

[[action.outlook.unread.step]]
do = "read"
region = "list"
as = "items"
fields = { sender = "title", subject = "subtitle", preview = "text" }
into = "messages"

[action.outlook.open]
summary = "Open the message with this subject from the list and return its reading pane."
args.subject = { type = "text", max_len = 300 }

[[action.outlook.open.step]]
do = "focus"
switch = true

[[action.outlook.open.step]]
do = "press"
keys = "ctrl+1"
expect = { view = "mail", ready = true }

[[action.outlook.open.step]]
do = "click"
target = { text = "{subject}", region = "list" }
expect = { text = "{subject}", region = "reading" }

[[action.outlook.open.step]]
do = "read"
region = "reading"
into = "message"
