# Browser actions, built in. Only a URL is typed into the address bar: anything else would
# be sent to a search engine on Enter, so goto refuses it before any input. Enter is
# irreversible in a browser (apps/browser.toml), as for jharokha_press: goto needs a call
# with allow="irreversible", the same as typing the URL and Enter by hand.
format = 1

[action.browser.goto]
summary = "Bring the browser forward and go to a URL through its address bar."
max_risk = "irreversible"
args.url = { type = "text", max_len = 2000, pattern = '(https?://)?([\w-]+\.)+[A-Za-z]{2,}(:\d+)?(/\S*)?' }

[[action.browser.goto.step]]
do = "focus"
switch = true

[[action.browser.goto.step]]
do = "click"
target = { region = "address" }
risk = "reversible"

[[action.browser.goto.step]]
do = "type"
text = "{url}"
risk = "reversible"

[[action.browser.goto.step]]
do = "press"
keys = "enter"
risk = "irreversible"
expect = { text = "{url}", region = "address" }
timeout_s = 15

# A named button on a page can submit or buy: each click is declared irreversible, so a
# session guard that allows only reversible steps refuses the whole sequence up front.
[action.browser.click_sequence]
summary = """Click buttons or links by their text in order, the whole sequence a number of
times, checking each is on screen before it is clicked."""
max_risk = "irreversible"
args.buttons = { type = "list", max_len = 100 }
args.times = { type = "number", default = 1 }

[[action.browser.click_sequence.step]]
do = "focus"
switch = true

[[action.browser.click_sequence.step]]
do = "repeat"
times = "{times}"

[[action.browser.click_sequence.step.step]]
do = "repeat"
each = "buttons"
as = "button"

[[action.browser.click_sequence.step.step.step]]
do = "click"
target = { text = "{button}" }
risk = "irreversible"
