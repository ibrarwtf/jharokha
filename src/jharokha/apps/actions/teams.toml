# Teams actions, built in, on the chat view. Enter in the compose box sends, so a newline in
# typed text is Shift+Enter here (the app's policy, apps/teams.toml), and no action presses
# Enter or clicks Send: drafting is as far as they go.
format = 1

[action.teams.open_chat]
summary = "Bring Teams forward and open the chat with this name from the chat list."
max_risk = "reversible"
args.name = { type = "text", max_len = 200 }

[[action.teams.open_chat.step]]
do = "focus"
switch = true
view = "chat"

# The header shows the open chat's name next to icon glyphs and cut short when long: it is
# matched as a name (a prefix up to an ellipsis, junk glyphs ignored), not as exact text.
# A chat already open is not clicked again in the list, which would also mark it read.
[[action.teams.open_chat.step]]
do = "click"
target = { text = "{name}", region = "list" }
risk = "reversible"
unless = { name = "{name}", region = "header" }
expect = { name = "{name}", region = "header" }

[action.teams.messages]
summary = """The messages in a chat from one day or time to another, oldest first: scrolls
back until one at or before `from` is on screen (or the chat's start), then down collecting
until one past `to` shows (or the newest message). Each has sender, time and text (screen
text). Days are inclusive (`to = "27/09"` keeps all of 27/09). Without chat, the open chat
is read."""
max_risk = "reversible"
args.chat = { type = "text", max_len = 200, default = "", doc = "omit to read the chat open now" }
args.from = { type = "text", pattern = '[\w/:., ]{2,30}', doc = "as the thread prints times: 21/09, 16/10 11:40, Yesterday, Mon" }
args.to = { type = "text", pattern = '[\w/:., ]{2,30}', default = "", doc = "the last day or time kept; omit for up to now" }

[[action.teams.messages.step]]
do = "focus"
switch = true
view = "chat"

[[action.teams.messages.step]]
do = "click"
target = { text = "{chat}", region = "list" }
risk = "reversible"
unless = { name = "{chat}", region = "header" }
expect = { name = "{chat}", region = "header" }

# Back in long strides, reading only to know when to stop: overshooting costs a few screens
# on the way down, each stride read costs a capture.
[[action.teams.messages.step]]
do = "scroll"
region = "thread"
exclude = "compose"
ticks = 150
max = 60
until = { before = "{from}", region = "thread" }
# A group chat begins with Teams' own line about who added whom.
end = { regex = 'to the chat\.?$', region = "thread" }
timeout_s = 20

# Down a screen at a time, short of a full one so no message falls between two reads.
[[action.teams.messages.step]]
do = "scroll"
region = "thread"
exclude = "compose"
ticks = -7
max = 400
until = { after = "{to}", region = "thread" }
collect = "messages"
since = "{from}"
upto = "{to}"
timeout_s = 20

[[action.teams.messages.step]]
do = "extract"
items = "messages"
pick = "count"
into = "count"

[action.teams.draft]
summary = """Type text into a chat's compose box and leave it there: newlines become
Shift+Enter, and nothing is sent. Read it back, then send it yourself if you mean to."""
max_risk = "reversible"
args.chat = { type = "text", max_len = 200 }
args.text = { type = "text", max_len = 4000 }

[[action.teams.draft.step]]
do = "focus"
switch = true
view = "chat"

[[action.teams.draft.step]]
do = "click"
target = { text = "{chat}", region = "list" }
risk = "reversible"
unless = { name = "{chat}", region = "header" }
expect = { name = "{chat}", region = "header" }

[[action.teams.draft.step]]
do = "click"
target = { region = "compose" }
risk = "reversible"

[[action.teams.draft.step]]
do = "type"
text = "{text}"
newline = "shift+enter"
risk = "reversible"
expect = { text = "{text}", region = "compose" }
