# What any screen has: no cues, so it is what a screen is when no app scores high enough;
# it is read by its panes (P0, P1, ...). Also the session's own Windows taskbar, under every
# app (its bottom 60 px, measured on a maximised session window).
format = 1

[app.generic]
name = "Any app"

[app.generic.view.screen]

[session.region.taskbar]
at = [0.5, 0.99]
box = [0, 0.949, 1, 0.051]
