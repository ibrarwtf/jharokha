# New Outlook, built in. Generic UI text only; positions are fractions of the client area,
# measured at 1166x1181 and 125% scaling: a ribbon from y=103 to 154 between dividers, the
# app rail left of a divider at x=61, then (mail) folders, the message list and, past a
# divider at x=500, the reading pane; (calendar) the calendars and a work-week grid.
format = 1

[app.outlook]
name = "Outlook"

[[app.outlook.cue]]  # the app rail
pane = [0, 0.131, 0.052, 0.818]
weight = 0.5

[[app.outlook.cue]]  # the ribbon
pane = [0, 0.088, 1, 0.042]
weight = 0.5

[app.outlook.policy]  # reserved: risk, from 0.19

[app.outlook.view.mail]
ready = "Inbox"

[[app.outlook.view.mail.cue]]
text = "Inbox"
weight = 2

[[app.outlook.view.mail.cue]]
text = "New mail"
weight = 2

[[app.outlook.view.mail.cue]]
text = "Sent Items"

[[app.outlook.view.mail.cue]]
text = "Deleted Items"

[app.outlook.view.mail.region.ribbon]
at = [0.5, 0.11]
box = [0, 0.088, 1, 0.042]

[app.outlook.view.mail.region.folders]
at = [0.12, 0.5]
box = [0.053, 0.131, 0.136, 0.818]

[app.outlook.view.mail.region.list]
reader = "list"
kind = "mails"
at = [0.3, 0.5]
box = [0.189, 0.131, 0.24, 0.818]

[app.outlook.view.mail.region.reading]
at = [0.7, 0.5]
box = [0.43, 0.131, 0.57, 0.818]
focus = true

# The view switch outlasts the screen settling: the ribbon changes first and the grid
# arrives later, so the view is ready once its date header says Today.
[app.outlook.view.calendar]
ready = "Today"

[[app.outlook.view.calendar.cue]]
text = "New event"
weight = 2

[[app.outlook.view.calendar.cue]]
text = "Work week"

[[app.outlook.view.calendar.cue]]
text = "Month"

[[app.outlook.view.calendar.cue]]
text = "Today"

[app.outlook.view.calendar.region.ribbon]
at = [0.5, 0.11]
box = [0, 0.088, 1, 0.042]

[app.outlook.view.calendar.region.calendars]
at = [0.15, 0.5]
box = [0.053, 0.131, 0.188, 0.818]

# The grid draws a line around every day and hour, so its pixels split into cells: the
# region runs from the cell under `at` (hours, top left) to the one under `to`.
[app.outlook.view.calendar.region.week]
reader = "table"
at = [0.26, 0.19]
to = [0.97, 0.9]
box = [0.24, 0.18, 0.76, 0.77]
focus = true
