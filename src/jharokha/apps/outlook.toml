# New Outlook, built in. Generic UI text only; positions are fractions of the client area,
# measured at 1150x1181 and 125% scaling with the folder pane collapsed, which is how it
# fits a session this wide: a title bar naming the app above the menu row, a ribbon from
# y=103 to 154 between dividers, the app rail left of a divider at x=60, then (mail) the
# message list to x=480 and, past a gap, the reading pane; (calendar) a work-week grid.
# The folder list is a flyout the menu button (top left of the menu row) opens over the
# message list, and a click on a folder in it closes it.
format = 1

[app.outlook]
name = "Outlook"

[[app.outlook.cue]]  # the title bar names the app
text = "Outlook"
at = [0.055, 0.017]
weight = 3

[[app.outlook.cue]]  # the app rail
pane = [0, 0.131, 0.052, 0.818]
weight = 0.5

[[app.outlook.cue]]  # the ribbon
pane = [0, 0.088, 1, 0.042]
weight = 0.5

# Enter in a mail adds a line; Ctrl+Enter and Alt+S send the mail being written, to
# everyone it is addressed to.
[app.outlook.policy]
irreversible_keys = ["ctrl+enter", "alt+s"]

# With the folder pane collapsed the list's header alone names the folder (the Focused and
# Other tabs for an inbox with focused inbox on), and says the list has loaded.
[app.outlook.view.mail]
ready = ["Inbox", "Focused", "Other", "Sent Items", "Drafts", "Deleted Items", "Junk Email", "Archive", "Outbox"]

[[app.outlook.view.mail.cue]]
text = ["Inbox", "Focused", "Other", "Sent Items", "Drafts", "Deleted Items", "Junk Email", "Archive", "Outbox"]
weight = 2

[[app.outlook.view.mail.cue]]  # the button reads "New mail" or "New email" by version
text = ["New mail", "New email", "New message"]
weight = 2

[[app.outlook.view.mail.cue]]
text = ["Quick steps", "Reply all", "Forward", "Mark all as read", "Sweep", "Move to", "Report"]
weight = 1.5

[app.outlook.view.mail.region.ribbon]
box = [0, 0.088, 1, 0.042]

[app.outlook.view.mail.region.menu]  # the button that opens the folder flyout
box = [0.06, 0.052, 0.05, 0.035]

[app.outlook.view.mail.region.folders]  # the flyout, while it is open
box = [0.052, 0.09, 0.252, 0.86]

[app.outlook.view.mail.region.list]
reader = "list"
kind = "mails"
box = [0.052, 0.131, 0.365, 0.818]

[app.outlook.view.mail.region.reading]
box = [0.448, 0.131, 0.534, 0.818]
focus = true

# The view switch outlasts the screen settling: the ribbon changes first and the grid
# arrives later, so the view is ready once its date header says Today.
[app.outlook.view.calendar]
ready = "Today"

[[app.outlook.view.calendar.cue]]
text = "New event"
weight = 2

[[app.outlook.view.calendar.cue]]
text = "Work week"

[[app.outlook.view.calendar.cue]]
text = "Month"

[[app.outlook.view.calendar.cue]]
text = "Today"

[app.outlook.view.calendar.region.ribbon]
box = [0, 0.088, 1, 0.042]

# The grid draws a line around every day and hour, so its pixels split into cells: the
# region runs from the cell under `at` (hours, top left) to the one under `to`.
[app.outlook.view.calendar.region.week]
reader = "table"
at = [0.09, 0.22]
to = [0.97, 0.93]
box = [0.06, 0.19, 0.92, 0.76]
focus = true
