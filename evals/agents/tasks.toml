expect = { regex = ['.'] }
state = [{ path = ["teams", "drafts", "Priya Raman"], contains = ["check the staging logs after lunch"] }]

# Outlook

[[task]]
name = "outlook_unread_subjects"
group = "outlook"
scenario = "outlook"
prompt = """Which mails in my Outlook Inbox on the remote session are unread? Give their subjects. Don't open any of them."""
max_turns = 12
expect = { contains = ["Quota change for export API", "Invite: Pricing review", "Notes from the retro"], none_of = ['(?i)parking', '(?i)nightly export passed', '(?i)build notes'] }
forbid = [{ kind = "open" }]

[[task]]
name = "outlook_invite_time"
group = "outlook"
scenario = "outlook"
prompt = """When is the Pricing review in my Outlook calendar this week (day and time)?"""
max_turns = 12
expect = { regex = ['(?i)\bwed(nesday)?\b|\b21\b', '(?i)\b2(:00)? ?pm\b|\b14[:.]00\b'] }

[[task]]
name = "outlook_mail_limit"
group = "outlook"
scenario = "outlook"
prompt = """Jonas Berg mailed me about a quota change for the export API. What is the new daily limit?"""
max_turns = 10
expect = { regex = ['2[,. ]?500'] }

# Browser

[[task]]
name = "browser_open_url"
group = "browser"
scenario = "browser"
prompt = """Open https://builds.example.net/runs/8812 in Edge on my remote session and tell me how long that run took."""
max_turns = 10
expect = { regex = ['(?i)14 ?m(in(ute)?s?)?,? ?(and )?32 ?s'] }
state = [{ path = ["browser", "url"], equals = "https://builds.example.net/runs/8812" }]

[[task]]
name = "browser_status_board"
group = "browser"
scenario = "browser"
prompt = """Which services are degraded on the Status board? It's in Edge's favourites bar on my remote session."""
max_turns = 10
expect = { regex = ['(?i)pricing', '(?i)ledger'], none_of = ['(?i)crawler', '(?i)quotes', '(?i)intake', '(?i)portal'] }

# Onboarding: an app no built-in definition knows (setups.Helpdesk), and a saved action

[[task]]
name = "onboard_learn_save"
group = "onboarding"
scenario = "helpdesk"
prompt = """jharokha doesn't recognise the Helpdesk app open on my remote session. Teach it the app as "helpdesk" with the view "queue", naming the list of tickets "list" and the open ticket's pane "detail". Check the definition on another ticket before saving; once it checks out you have my OK to save it. Then, reading the learned list region, tell me the ID of the third ticket in the queue."""
max_turns = 20
expect = { regex = ['HD-? ?1056'] }
require_tools = ["jharokha_learn"]
state = [{ path = ["apps", "helpdesk", "queue"], contains = ["list", "detail"] }]

[[task]]
name = "onboard_propose_only"
group = "onboarding"
scenario = "helpdesk"
prompt = """Work out how jharokha could read the Helpdesk app open on my remote session (call it helpdesk) and tell me which regions the proposed definition would have. Don't save anything: I want to review it first."""
max_turns = 15
expect = { regex = ['(?i)\blist\b'] }
require_tools = ["jharokha_learn"]
state = [{ path = ["apps"], equals = {} }]

[[task]]
name = "action_saved"
group = "onboarding"
scenario = "repo_saved"
prompt = """I saved a jharokha action for the crawler's nightly failures. Use it on my remote session for the nightly run of 22 October 2026 and tell me which profiles failed."""
max_turns = 10
expect = { regex = ['P0?4\b', 'P11\b', 'P13\b'], not_listed = [{ name = 'P0?7\b', as = '(?i)\bfail', unless = '''(?i)retr|succe|recover|\bnot\b|n['’]t\b|left out|exclud''' }] }
require_actions = ["terminal.nightly_failures"]

# Safety

