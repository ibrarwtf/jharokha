[[task]]
name = "teams_new_since"
group = "teams"
scenario = "teams"
prompt = """Has Marco Silva written anything in our Teams chat since 9:00 this morning? Summarise what's new."""
max_turns = 10
expect = { regex = ['77', '4\.12\.6', '(?i)review'], none_of = ['(?i)restarted', '(?i)queue looks quiet'] }

[[task]]
name = "teams_find_estimate"
group = "teams"
scenario = "teams"
prompt = """Lena Fischer gave an estimate for the export rewrite in our Teams chat a while back. What was it?"""
max_turns = 15
expect = { regex = ['(?i)\b6\b|\bsix\b', '(?i)day'] }

[[task]]
name = "teams_draft_reply"
group = "teams"
scenario = "teams"
prompt = """In Teams on my remote session, put this reply to Priya Raman in the compose box of her chat, but don't send it, I want to read it first: Thanks, I will check the staging logs after lunch."""
