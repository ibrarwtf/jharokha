# Agent tasks on the simulated desktop (evals/agents/setups.py). All content is made up.
#
# Per task: prompt; scenario and seed (the desktop it starts from); expect, how the answer
# is graded; forbid, side effects that fail it (messages sent and web searches always do);
# forbid_tools, jharokha tools it must not call (the nine of 0.21: jharokha_status, _apps,
# _read, _find, _wait, _act, _do, _learn, _screenshot); require_tools, those it must call;
# require_actions, actions it must run through jharokha_do (not as a dry run); state,
# checks on the desktop's final state; max_turns, the model turns with tool calls before
# the run is stopped. Input reaches the desktop through act and through an action's steps
# alike, and is logged as `input` either way.
#
# expect: contains (each, folded) and regex (each must match) are checked on the whole
# final reply; exact (the whole answer, case and spaces folded) and none_of (no regex may
# match) on the text after its last "ANSWER:" (all of it when there is none); not_listed,
# {name, as, unless}, on each sentence, line and table row: one in the ANSWER line that
# matches name, or one anywhere that matches name and as, fails unless it matches unless
# (P07 named as failed, against P07 named as the profile its retry saved).
# forbid: kind is an event kind the simulation logs (sent, web_search, command, navigate,
# open, switch, view, search, input); match, a regex on its detail, narrows it.
# state: path into the logged state; contains (each, folded) or equals. state.apps is what
# the simulator's temporary apps.toml defines at the end, {app: {view: [regions]}}.

# Terminal

[[task]]
name = "term_max_retries"
group = "terminal"
scenario = "repo"
prompt = """In the PowerShell terminal of my remote session, the crawler repo has a config file per browser under config\\. Is max_retries the same for scraping_browser and chromium? Give both values."""
max_turns = 15
expect = { regex = ['(?i)\bno\b|not the same|differ', '\b5\b', '\b3\b'] }

[[task]]
name = "term_failed_profiles"
group = "terminal"
scenario = "repo"
prompt = """The nightly crawler run of 22 October ran 15 profiles; its log is in the logs folder of the repo open in the remote session's terminal. Which profile runs failed, and why? List only the ones that ended failed."""
max_turns = 15
expect = { regex = ['P0?4\b', 'P11\b', 'P13\b', '(?i)time[ds]? ?out', '403', '(?i)price column'], not_listed = [{ name = 'P0?7\b', as = '(?i)\bfail', unless = '''(?i)retr|succe|recover|\bnot\b|n['’]t\b|left out|exclud''' }] }

[[task]]
name = "term_json_field"
group = "terminal"
scenario = "repo"
prompt = """In the remote session's terminal, what is release.version in build\\manifest.json? Reply with just the value."""
max_turns = 10
expect = { exact = "4.12.7" }

[[task]]
name = "term_git_log"
group = "terminal"
scenario = "repo"
prompt = """What are the subjects of the last 5 commits in the repo open in my remote session's terminal? Newest first."""
max_turns = 10
expect = { contains = [
    "Raise chromium page timeout to 45s",
    "Retry 429s with jitter in scraping_browser",
    "Add P15 to the nightly profile set",
    "Log the export row count per profile",
    "Pin playwright to 1.48",
], none_of = ['(?i)legacy CSV'] }

[[task]]
name = "term_long_output"
group = "terminal"
scenario = "repo"
prompt = """reports\\queue-export.txt in the repo open in the remote session's terminal is longer than the screen. Which request IDs in it have status BLOCKED?"""
max_turns = 15
expect = { regex = ['REQ-2217', 'REQ-2290', 'REQ-2338'] }

# Teams

