[project]
name = "jharokha"
version = "0.1.0"
description = "Local MCP server that reads a Windows remote-desktop window as text. Looks; does not touch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "mcp>=2.3,<3",
    "Pillow>=11",
    "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
]

[project.scripts]
jharokha = "jharokha.__main__:main"

[project.urls]
Repository = "https://github.com/ibrarwtf/jharokha"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["windows: needs the real Windows OCR engine"]
