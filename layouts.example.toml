# Named regions for jharokha. Copy to layouts.toml (git-ignored) and measure your own:
# `jharokha_layout` prints the detected panels in client pixels; divide by the client size.
#
# One table per app. Each region is [x, y, width, height] as fractions 0..1 of the client
# area, so the file fits any window size. `anchor` (optional) is text that must be on
# screen for the layout to apply; a tool given `teams.thread` while it is missing fails
# with layout_mismatch instead of reading the wrong part of the screen.
#
# Variants: tables named `app@variant` (quote the name: ["teams@zoom90"]) are one app
# measured several ways, e.g. once per zoom level. Each sets `anchor_at = [x, y]`, the
# fractions where its anchor text sat when measured; `teams.thread` then uses the variant
# whose anchor is nearest to where it is now.
#
# `focus` (optional, needs anchor) names the region input tools report changes in while the
# app is on screen: after a click in the chat list you get the thread that opened, not the
# list again. `jharokha measure APP --focus NAME` writes it; remeasuring keeps it.
#
# `grid` (optional, needs anchor) names a region that is a character grid, a terminal's
# body: it is read row by row on that grid, which keeps paths, numbers and table columns
# that plain OCR splits apart. `jharokha measure APP --grid NAME` writes it.
#
# Picked up from --layouts PATH, else $JHAROKHA_LAYOUTS, else ./layouts.toml.
# These values fit the synthetic chat and mail screens in tests/eval_ocr.py.

[teams]
anchor = "Chat"
focus = "thread"
list = [0, 0, 0.24, 1]
thread = [0.24, 0, 0.76, 1]

[terminal]
anchor = "PS C:"
focus = "body"
grid = "body"
body = [0, 0, 1, 1]

[outlook]
anchor = "Inbox"
focus = "reading"
folders = [0, 0, 0.14, 1]
list = [0.14, 0, 0.325, 1]
reading = [0.465, 0, 0.535, 1]
