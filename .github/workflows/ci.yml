name: ci
on:
  push:
    branches: [main]
    # Minor releases only: the full eval. Patch and suffixed tags (v0.x.y, v0.x.0-rc1) skip it.
    tags: ["v*.*.0"]
  pull_request:
  # Run by hand to regenerate the eval baselines on the runner that checks them.
  workflow_dispatch:

jobs:
  checks:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  evals:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync
      - name: evals (quick on pushes, full on v0.x.0 tags)
        if: github.event_name != 'workflow_dispatch'
        run: uv run python -m evals ${{ github.ref_type == 'tag' && '--full' || '--quick' }} --check --out evals-results.json
      - name: new baselines
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv run python -m evals --quick --update --out evals-results.json
          uv run python -m evals --full --update
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-results
          path: |
            evals-results.json
            evals/baseline-*.json

  gitleaks:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
